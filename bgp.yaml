---
- name: Configure BGP
  hosts: routers
  gather_facts: no
  connection: network_cli

  vars:
    bgp:
      asn: 65001
      neighbors:
        - ip: 192.168.1.2
          remote_as: 65002
        - ip: 192.168.1.3
          remote_as: 65003

      networks:
        - "10.10.10.10 mask 255.255.255.0"
        - "172.16.0.0  mask 255.255.0.0"

  tasks:
    - name: Configure BGP neighbors
      cisco.ios.ios_config:
        parents:
          - "router bgp {{bgp.asn}}"
        lines: |
          {% for n in bgp.neighbors %}
          neighbor {{ n.ip }} remote_as {{ n.remote_as }}
          {% endfor %}
          {% for net in bgp.networks %}
          network {{ net }}
          {% endfor %}