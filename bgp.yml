---
- name: Configure BGP
  hosts: routers
  gather_facts: no

  routers:
    - host: 192.168.1.1
      username: admin
      password: admin
      secret: enable123
      device_type: cisco_ios
      bgp:
        asn: 65001
        neighbor_ip: 10.0.0.2
        neighbor_as: 65002

    - host: 192.168.1.2
      username: admin
      password: admin
      secret: enable123
      device_type: cisco_ios
      bgp:
        asn: 65001
        neighbor_ip: 10.0.0.1
        neighbor_as: 65001